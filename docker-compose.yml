# Backend: create backend/.env.docker from backend/.env.docker.example (JWT + S3 keys).
# Infra (DATABASE_URL, S3_ENDPOINT, etc.) is set in environment below; do not rely on local .env.

services:
  backend:
    build:
      context: ./backend
    container_name: zeekr-backend
    env_file:
      - ./backend/.env.docker
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://zeekr_user:zeekr_pass@postgres:5432/zeekracademy
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_REGION: us-east-1
      S3_BUCKET: zeekr-academy-media
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  postgres:
    image: postgres:15
    container_name: zeekr-postgres
    environment:
      POSTGRES_USER: zeekr_user
      POSTGRES_PASSWORD: zeekr_pass
      POSTGRES_DB: zeekracademy
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeekr_user -d zeekracademy"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    container_name: zeekr-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    # Official minio/minio image has no curl/wget; backend starts after container is up.
    # For MinIO readiness, use a custom image with curl or a sidecar.

  prometheus:
    image: prom/prometheus
    container_name: zeekr-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: zeekr-grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  pg_data:
  minio_data:
