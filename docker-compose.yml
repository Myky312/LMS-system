# Backend: create backend/.env.docker from backend/.env.docker.example (JWT + S3 keys).
# Infra (DATABASE_URL, S3_*) is set below. DATABASE_URL must be the main DB (zeekracademy), not *_test.

services:
  backend:
    build:
      context: ./backend
    container_name: zeekr-backend
    env_file:
      - ./backend/.env.docker
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Main DB only (test DB is used only when running E2E tests outside Docker)
      DATABASE_URL: postgresql://zeekr_user:zeekr_pass@postgres:5432/zeekracademy
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_REGION: us-east-1
      S3_BUCKET: zeekr-academy-media
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  postgres:
    image: postgres:15
    container_name: zeekr-postgres
    environment:
      POSTGRES_USER: zeekr_user
      POSTGRES_PASSWORD: zeekr_pass
      POSTGRES_DB: zeekracademy
    # Host 5433 avoids conflict when another Postgres already uses 5432 (containers still use postgres:5432).
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeekr_user -d zeekracademy"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    container_name: zeekr-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    # Official minio/minio image has no curl/wget; backend starts after container is up.
    # For MinIO readiness, use a custom image with curl or a sidecar.

  prometheus:
    image: prom/prometheus
    container_name: zeekr-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: zeekr-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  # Drizzle Studio — starts with docker compose up; open https://local.drizzle.studio (allow Local network access in Chrome).
  db-studio:
    build:
      context: ./backend
      target: builder
    command: pnpm exec drizzle-kit studio --host 0.0.0.0
    environment:
      DATABASE_URL: postgresql://zeekr_user:zeekr_pass@postgres:5432/zeekracademy
    ports:
      - "4983:4983"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  minio_data:
